name: CI

on:
  push:
    branches: [main, grid-core]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.25
      - name: Resolve dependency lock
        run: uv lock
      - name: Commit dependency lock when generated
        shell: bash
        run: |
          if ! git diff --quiet -- uv.lock || [ -n "$(git ls-files --others --exclude-standard uv.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "build: lock project dependencies"
            git push
          fi
      - name: Sync locked environment
        run: uv sync --all-extras --frozen
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Type check
        run: uv run mypy src tests
