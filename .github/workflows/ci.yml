name: CI

on:
  push:
    branches: [main, grid-core]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.25
      - name: Verify dependency lock
        run: uv lock --check
      - name: Sync core development environment
        run: uv sync --extra dev --frozen
      - name: Check formatting
        run: uv run --frozen --extra dev ruff format --check .
      - name: Lint
        run: uv run --frozen --extra dev ruff check .
      - name: Test
        run: uv run --frozen --extra dev pytest -q
      - name: Type check
        run: uv run --frozen --extra dev mypy src tests
