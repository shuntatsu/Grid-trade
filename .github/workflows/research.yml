name: Research Integration

on:
  push:
    branches: [main]
    paths:
      - "src/grid_trade/application/**"
      - "src/grid_trade/calibration/**"
      - "src/grid_trade/datasets/**"
      - "src/grid_trade/domain/**"
      - "src/grid_trade/evidence/**"
      - "src/grid_trade/execution/**"
      - "src/grid_trade/integrations/**"
      - "src/grid_trade/research/**"
      - "src/grid_trade/risk/**"
      - "src/grid_trade/strategy/**"
      - "tests/application/**"
      - "tests/architecture/**"
      - "tests/calibration/**"
      - "tests/datasets/**"
      - "tests/evidence/**"
      - "tests/execution/**"
      - "tests/integrations/**"
      - "tests/research/**"
      - "tests/risk/**"
      - "tests/strategy/**"
      - "tests/fixtures/hyperliquid/**"
      - "tests/fixtures/microstructure/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/research.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/grid_trade/application/**"
      - "src/grid_trade/calibration/**"
      - "src/grid_trade/datasets/**"
      - "src/grid_trade/domain/**"
      - "src/grid_trade/evidence/**"
      - "src/grid_trade/execution/**"
      - "src/grid_trade/integrations/**"
      - "src/grid_trade/research/**"
      - "src/grid_trade/risk/**"
      - "src/grid_trade/strategy/**"
      - "tests/application/**"
      - "tests/architecture/**"
      - "tests/calibration/**"
      - "tests/datasets/**"
      - "tests/evidence/**"
      - "tests/execution/**"
      - "tests/integrations/**"
      - "tests/research/**"
      - "tests/risk/**"
      - "tests/strategy/**"
      - "tests/fixtures/hyperliquid/**"
      - "tests/fixtures/microstructure/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/research.yml"

permissions:
  contents: read

concurrency:
  group: research-v7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.25
      - name: Verify dependency lock
        run: uv lock --check
      - name: Sync research environment
        run: uv sync --extra dev --extra research --frozen
      - name: Run research integration tests
        run: >-
          uv run --frozen --extra dev --extra research pytest -m research -q
          tests/research tests/integrations
      - name: Type check S1 research boundary
        run: >-
          uv run --frozen --extra dev --extra research mypy
          src/grid_trade/research/s1_runner.py
          tests/research/test_s1_runner.py
      - name: Type check S2 research boundary
        run: >-
          uv run --frozen --extra dev --extra research mypy
          src/grid_trade/research/s2_runner.py
          tests/research/test_s2_runner.py
      - name: Type check adaptive research boundary
        run: >-
          uv run --frozen --extra dev --extra research mypy
          src/grid_trade/research/adaptive_runner.py
          tests/research/test_adaptive_runner.py
      - name: Type check microstructure calibration research boundary
        run: >-
          uv run --frozen --extra dev --extra research mypy
          src/grid_trade/research/microstructure_calibration_runner.py
          tests/research/test_microstructure_calibration_runner.py
      - name: Type check calibrated adaptive research boundary
        run: >-
          uv run --frozen --extra dev --extra research mypy
          src/grid_trade/research/calibrated_adaptive_runner.py
          tests/research/test_calibrated_adaptive_runner.py
      - name: Type check Tier-2 data and replay boundary
        run: >-
          uv run --frozen --extra dev --extra research mypy
          src/grid_trade/datasets
          src/grid_trade/integrations/hyperliquid
          src/grid_trade/research/hftbacktest_adapter.py
          src/grid_trade/research/replay_attribution.py
          src/grid_trade/research/tier2_calibrated_candidate.py
          src/grid_trade/research/tier2_calibrated_replay.py
          src/grid_trade/research/tier2_replay.py
          src/grid_trade/research/tier2_fixture_runner.py
          tests/datasets
          tests/integrations/hyperliquid
          tests/research/test_canonical_hftbacktest_adapter.py
          tests/research/test_hftbacktest_pinned_limitations.py
          tests/research/test_replay_attribution.py
          tests/research/test_replay_visibility_attribution.py
          tests/research/test_tier2_calibrated_candidate.py
          tests/research/test_tier2_causality.py
          tests/research/test_tier2_replay.py
          tests/research/test_tier2_replay_determinism.py
          tests/research/test_tier2_visibility_boundary.py
      - name: Verify S0 evidence across fresh processes
        shell: bash
        run: |
          first="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.s0_runner)"
          second="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.s0_runner)"
          test -n "$first"
          test "$first" = "$second"
          echo "S0 evidence digest: $first"
      - name: Verify S1 evidence across fresh processes
        shell: bash
        run: |
          first="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.s1_runner)"
          second="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.s1_runner)"
          test -n "$first"
          test "$first" = "$second"
          echo "S1 evidence digest: $first"
      - name: Verify S2 evidence across fresh processes
        shell: bash
        run: |
          first="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.s2_runner)"
          second="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.s2_runner)"
          test -n "$first"
          test "$first" = "$second"
          echo "S2 evidence digest: $first"
      - name: Verify adaptive evidence across fresh processes
        shell: bash
        run: |
          first="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.adaptive_runner)"
          second="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.adaptive_runner)"
          test -n "$first"
          test "$first" = "$second"
          echo "Adaptive evidence digest: $first"
      - name: Verify microstructure calibration evidence across fresh processes
        shell: bash
        run: |
          first="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.microstructure_calibration_runner)"
          second="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.microstructure_calibration_runner)"
          test -n "$first"
          test "$first" = "$second"
          echo "Microstructure calibration evidence digest: $first"
      - name: Verify calibrated adaptive evidence across fresh processes
        shell: bash
        run: |
          first="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.calibrated_adaptive_runner)"
          second="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.calibrated_adaptive_runner)"
          test -n "$first"
          test "$first" = "$second"
          echo "Calibrated adaptive evidence digest: $first"
      - name: Verify Tier-2 evidence across fresh processes
        shell: bash
        run: |
          first="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.tier2_fixture_runner)"
          second="$(PYTHONPATH=src uv run --frozen --extra dev --extra research python -m grid_trade.research.tier2_fixture_runner)"
          test -n "$first"
          test "$first" = "$second"
          echo "Tier-2 evidence digest: $first"
