name: Research Integration

on:
  push:
    branches: [grid-core]
    paths:
      - "src/grid_trade/research/**"
      - "src/grid_trade/integrations/**"
      - "tests/research/**"
      - "tests/integrations/**"
      - "tests/fixtures/microstructure/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/research.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/grid_trade/research/**"
      - "src/grid_trade/integrations/**"
      - "tests/research/**"
      - "tests/integrations/**"
      - "tests/fixtures/microstructure/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/research.yml"

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.25
      - name: Verify dependency lock
        run: uv lock --check
      - name: Sync research environment
        run: uv sync --extra dev --extra research --frozen
      - name: Run research integration tests
        run: uv run --frozen --extra dev --extra research pytest -m research -q tests/research
