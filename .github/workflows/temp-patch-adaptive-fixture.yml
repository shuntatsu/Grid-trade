name: Temporary Adaptive Fixture Patcher

on:
  push:
    branches: [adaptive-grid-completion]
    paths:
      - ".github/workflows/temp-patch-adaptive-fixture.yml"

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch stage-neutral controlled position
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/grid_trade/research/adaptive_runner.py')
          text = path.read_text()
          old = '("99.50", "0.012", "-0.04", "-0.90", "0.001", "0.5", "99.80"),'
          new = '("99.50", "0.012", "0", "-0.90", "0.001", "0.5", "99.80"),'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one controlled fixture row')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fixture correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/grid_trade/research/adaptive_runner.py
          git commit -m "fix: keep adaptive ablation position path stage-neutral"
          git push origin HEAD:adaptive-grid-completion
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/temp-patch-adaptive-fixture.yml
          git commit -m "chore: remove temporary adaptive fixture patcher"
          git push origin HEAD:adaptive-grid-completion
