name: Calibration Plan Fix

on:
  push:
    branches:
      - universal-calibration-final

permissions:
  contents: write

jobs:
  fix-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: universal-calibration-final
      - name: Apply self-review fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/superpowers/plans/2026-08-09-universal-calibration-foundation.md')
          text = path.read_text()
          old = 'Also test deterministic window truncation, invalid config, duplicate flat prices yielding zero scale, and non-monotonic timestamps rejected by a caller-facing update sequence helper.'
          new = 'Also test deterministic window truncation, invalid config, and duplicate flat prices yielding zero scale. Strict timestamp ordering is tested only at the Calibration Engine boundary in Task 6.'
          if old not in text:
              raise SystemExit('expected plan text not found')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/_calibration_plan_fix.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: tighten calibration plan responsibility"
          git push origin HEAD:universal-calibration-final
