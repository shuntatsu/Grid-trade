name: Temporary Phase C README updater

on:
  push:
    branches: [universal-calibration-strategy-integration]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: universal-calibration-strategy-integration
      - name: Update README and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          old = '''Phase B deliberately stops before strategy integration. S2–S7 still retain their controlled fixture inputs for regression. Phase C must compose the Foundation and Microstructure estimates into calibrated spacing, risk-derived quantity fractions, and adaptive signals, then prove the resulting strategy through realistic Tier-2 replay, symbol-disjoint walk-forward evaluation, sealed OOS tests, and stress gates.\n'''
          new = '''## Universal calibration → adaptive strategy integration\n\nPhase C adds a separate calibrated Application path while retaining the checked-in S0–S7 controlled fixture path unchanged for deterministic regression. The new path:\n\n- composes Foundation and Microstructure calibration with exact timestamp/source/instrument/mid consistency;\n- derives executable inventory capacity from `grid_trade.risk.sizing` and only rounds `Q_max` downward to the venue quantity step;\n- derives center thresholds, spacing limits, reservation skew, and order-book shift from volatility units rather than symbol-specific basis-point constants;\n- combines the volatility floor, GLFT quote-distance estimate, and calibrated execution/adverse-selection cost when deriving spacing;\n- consumes normalized funding with unit scale and normalized order-book/OFI state without symbol-specific divisors;\n- reconstructs calibrated microprice from relative displacement only when S7 microstructure evidence is ready;\n- compares an existing working ladder with the **previous applied runtime config** and the candidate ladder with the newly calibrated config, preventing dynamic parameter changes from being mistaken for queue-equivalent state;\n- keeps the previous config through cancel-before-replace and Risk rejection, committing the candidate config only when the candidate economic state is accepted;\n- preserves the Long → Flat → Short contract and leaves Hard Risk as the final veto authority;\n- emits additive deterministic calibrated-adaptive Evidence and proves arbitrary-symbol rename and common price/size scale invariance.\n\nThe calibrated integration runner still does not infer historical fills or PnL and explicitly records `economics_validated=false`, `alpha_validated=false`, and `production_authorized=false`. Strategy economics must still pass realistic continuous Tier-2 replay, symbol-disjoint walk-forward evaluation, sealed OOS tests, and stress gates before any production consideration.\n'''
          if old not in text:
              raise SystemExit('expected Phase B boundary paragraph not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/tmp-update-phase-c-readme.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m 'docs: document universal calibrated adaptive path'
          git push origin HEAD:universal-calibration-strategy-integration
