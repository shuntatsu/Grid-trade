name: Temporary calibrated runner formatter

on:
  push:
    branches: [universal-calibration-strategy-integration]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: universal-calibration-strategy-integration
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Clean and format runner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/grid_trade/research/calibrated_adaptive_runner.py')
          text = path.read_text()
          text = text.replace(
              'from grid_trade.calibration.engine import CalibrationEngineConfig\n',
              'from grid_trade.calibration.contracts import CalibrationObservation\nfrom grid_trade.calibration.engine import CalibrationEngineConfig\n',
              1,
          )
          old = '''        observation = __import__(\n            "grid_trade.calibration.contracts",\n            fromlist=["CalibrationObservation"],\n        ).CalibrationObservation(\n'''
          text = text.replace(old, '        observation = CalibrationObservation(\n', 1)
          text = text.replace(
              '            reference_price=init_update.foundation.market_state.timestamp\n            and _mid(2, price_scale),\n',
              '            reference_price=_mid(2, price_scale),\n',
              1,
          )
          path.write_text(text)
          PY
          python -m pip install ruff==0.15.22
          ruff format src/grid_trade/research/calibrated_adaptive_runner.py
          git rm .github/workflows/tmp-format-calibrated-runner.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/grid_trade/research/calibrated_adaptive_runner.py
          git commit -m 'style: clean calibrated adaptive research runner'
          git push origin HEAD:universal-calibration-strategy-integration
