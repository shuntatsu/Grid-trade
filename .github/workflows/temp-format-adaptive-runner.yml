name: Temporary Adaptive Runner Formatter

on:
  push:
    branches: [adaptive-grid-completion]
    paths:
      - ".github/workflows/temp-format-adaptive-runner.yml"

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.15.22
      - name: Format adaptive runner
        run: ruff format src/grid_trade/research/adaptive_runner.py
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/grid_trade/research/adaptive_runner.py; then
            git add src/grid_trade/research/adaptive_runner.py
            git commit -m "style: format adaptive evidence runner"
            git push origin HEAD:adaptive-grid-completion
          fi
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/temp-format-adaptive-runner.yml
          git commit -m "chore: remove temporary adaptive runner formatter"
          git push origin HEAD:adaptive-grid-completion
