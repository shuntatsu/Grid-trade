name: Temporary maintainability patch application

on:
  push:
    branches:
      - agent/maintainability-modularization
    paths:
      - .github/workflows/apply-maintainability-patch.yml

permissions:
  contents: write

concurrency:
  group: temporary-maintainability-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintainability-modularization
          fetch-depth: 0

      - name: Verify staged patch
        shell: bash
        run: |
          set -euo pipefail

          cat .maintainability-patch-xz/part-* > /tmp/maintainability.patch.xz.b64
          actual_base64_sha=$(sha256sum /tmp/maintainability.patch.xz.b64 | cut -d' ' -f1)
          echo "base64 sha256: ${actual_base64_sha}"
          test "${actual_base64_sha}" = \
            "ec9a997bf6b6188a9968c072ada757e661b959e8f455096bdeedcc48308658b9"

          base64 --decode /tmp/maintainability.patch.xz.b64 > /tmp/maintainability.patch.xz
          actual_xz_sha=$(sha256sum /tmp/maintainability.patch.xz | cut -d' ' -f1)
          echo "xz sha256: ${actual_xz_sha}"
          test "${actual_xz_sha}" = \
            "529a0b434797fa1056757021bdf81906a4595bceeb970da63642affc8b2a52e5"

          xz --decompress --stdout /tmp/maintainability.patch.xz > /tmp/maintainability.patch
          actual_patch_sha=$(sha256sum /tmp/maintainability.patch | cut -d' ' -f1)
          echo "patch sha256: ${actual_patch_sha}"
          test "${actual_patch_sha}" = \
            "481fa96765cdd18bc814e58957bc01d9c97878995c5d132e1ac520513d0cd22b"

          git apply --check /tmp/maintainability.patch

      - name: Apply patch and remove staging
        shell: bash
        run: |
          set -euo pipefail

          git apply --index /tmp/maintainability.patch
          git rm -r .maintainability-patch .maintainability-patch-xz
          git diff --cached --check

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "refactor: modularize maintainability hotspots"
          git push origin HEAD:agent/maintainability-modularization
