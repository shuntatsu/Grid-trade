name: Ruff import diagnostic

on:
  push:
    branches: [grid-core]

jobs:
  import-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.15.22
      - name: Show import fix diff
        run: ruff check tests/domain --select I --fix --diff
