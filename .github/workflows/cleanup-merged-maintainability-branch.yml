name: Temporary merged branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-maintainability-branch.yml

permissions:
  contents: write

concurrency:
  group: temporary-merged-maintainability-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch and verify repository refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="agent/maintainability-modularization"
          encoded_branch=$(python - "$branch" <<'PY'
          import sys
          from urllib.parse import quote

          print(quote(sys.argv[1], safe=""))
          PY
          )
          endpoint="repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}"

          gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" >/dev/null

          if gh api "$endpoint" >/dev/null 2>&1; then
            gh api --method DELETE "$endpoint"
          fi

          if gh api "$endpoint" >/dev/null 2>&1; then
            echo "Merged branch still exists after deletion" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" >/dev/null
