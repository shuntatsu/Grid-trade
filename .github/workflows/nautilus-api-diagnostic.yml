name: Nautilus API diagnostic

on:
  push:
    branches: [grid-core]

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.25
      - run: uv sync --extra research --frozen
      - name: Inspect Nautilus wheel API
        run: |
          uv run --frozen --extra research python - <<'PY'
          import importlib
          import pkgutil
          import nautilus_trader.common as common
          import nautilus_trader.model as model
          print('COMMON_ATTRS', [n for n in dir(common) if 'Clock' in n or 'Order' in n])
          print('MODEL_ATTRS', [n for n in dir(model) if n in {'OrderSide','TimeInForce','InstrumentId','Price','Quantity','StrategyId','TraderId'}])
          for root in ('nautilus_trader.common', 'nautilus_trader.model'):
              mod = importlib.import_module(root)
              print('SUBMODULES', root, sorted(m.name for m in pkgutil.iter_modules(mod.__path__)))
          candidates = [
              'nautilus_trader.common.clock',
              'nautilus_trader.common.factories',
              'nautilus_trader.model.enums',
              'nautilus_trader.model.identifiers',
              'nautilus_trader.model.objects',
          ]
          for name in candidates:
              try:
                  mod = importlib.import_module(name)
                  print('CANDIDATE', name, [n for n in dir(mod) if n in {'Clock','OrderFactory','OrderSide','TimeInForce','InstrumentId','Price','Quantity','StrategyId','TraderId'}])
              except Exception as exc:
                  print('CANDIDATE_ERROR', name, type(exc).__name__, str(exc))
          PY
