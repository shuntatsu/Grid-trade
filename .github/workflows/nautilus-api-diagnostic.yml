name: Nautilus API diagnostic

on:
  push:
    branches: [grid-core]

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.25
      - run: uv sync --extra research --frozen
      - name: Inspect Nautilus wheel API
        run: |
          uv run --frozen --extra research python - <<'PY'
          import importlib
          import inspect
          import pkgutil
          import nautilus_trader

          targets = [
              'nautilus_trader.common.factories',
              'nautilus_trader.core',
              'nautilus_trader.core.nautilus_pyo3',
              'nautilus_trader.model.enums',
              'nautilus_trader.model.identifiers',
              'nautilus_trader.model.objects',
          ]
          for name in targets:
              try:
                  mod = importlib.import_module(name)
                  names = [n for n in dir(mod) if n in {
                      'Clock','TestClock','LiveClock','OrderFactory','OrderSide','TimeInForce',
                      'InstrumentId','Price','Quantity','StrategyId','TraderId'
                  }]
                  print('TARGET', name, names)
                  for symbol in names:
                      obj = getattr(mod, symbol)
                      try:
                          print('SIGNATURE', name, symbol, inspect.signature(obj))
                      except Exception as exc:
                          print('SIGNATURE_ERROR', name, symbol, type(exc).__name__, str(exc))
                      print('DOC', name, symbol, repr(getattr(obj, '__doc__', None))[:1000])
              except Exception as exc:
                  print('TARGET_ERROR', name, type(exc).__name__, str(exc))

          core = importlib.import_module('nautilus_trader.core')
          if hasattr(core, '__path__'):
              print('CORE_SUBMODULES', sorted(m.name for m in pkgutil.iter_modules(core.__path__)))

          print('WALK_CLOCKS')
          for module_info in pkgutil.walk_packages(nautilus_trader.__path__, 'nautilus_trader.'):
              name = module_info.name
              if not any(token in name for token in ('.core', '.common')):
                  continue
              try:
                  mod = importlib.import_module(name)
              except Exception:
                  continue
              clocks = [n for n in dir(mod) if n in {'Clock','TestClock','LiveClock'}]
              if clocks:
                  print('CLOCK_MODULE', name, clocks)
          PY
