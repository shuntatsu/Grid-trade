name: Temporary source snapshot export

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-source-snapshot.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github/workflows/export-source-snapshot.yml \
            -czf grid-trade-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: grid-trade-source
          path: grid-trade-source.tar.gz
          if-no-files-found: error
          retention-days: 1
