name: Temporary generalization source export

on:
  push:
    branches:
      - agent/generalize-strategy-core
    paths:
      - .github/workflows/export-generalization-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/generalize-strategy-core
          fetch-depth: 0
      - name: Package source tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/grid-trade-generalization.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: grid-trade-generalization-source
          path: /tmp/grid-trade-generalization.tar.gz
          if-no-files-found: error
          retention-days: 1
