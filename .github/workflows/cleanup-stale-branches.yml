name: Temporary stale branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-stale-branches.yml

permissions:
  contents: write

concurrency:
  group: temporary-stale-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete fully integrated and superseded branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "hardening/deterministic-market-mid"
            "tier2-historical-forward-replay"
            "universal-calibrated-strategy-integration"
            "universal-calibration"
            "universal-calibration-design"
            "universal-calibration-final"
            "universal-calibration-spec"
            "universal-calibration-strategy-integration"
            "universal-calibration-v2"
            "universal-microstructure-calibration"
          )

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" || "$branch" == "$GITHUB_REF_NAME" ]]; then
              echo "Refusing to delete protected branch: $branch" >&2
              exit 1
            fi

            encoded_branch=$(python - "$branch" <<'PY'
          import sys
          from urllib.parse import quote

          print(quote(sys.argv[1], safe=""))
          PY
          )
            endpoint="repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}"

            if gh api "$endpoint" >/dev/null 2>&1; then
              echo "Deleting $branch"
              gh api --method DELETE "$endpoint"
            else
              echo "Already absent: $branch"
            fi
          done

          for branch in "${branches[@]}"; do
            encoded_branch=$(python - "$branch" <<'PY'
          import sys
          from urllib.parse import quote

          print(quote(sys.argv[1], safe=""))
          PY
          )
            endpoint="repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}"
            if gh api "$endpoint" >/dev/null 2>&1; then
              echo "Branch still exists after deletion: $branch" >&2
              exit 1
            fi
          done

          gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" >/dev/null

      - name: Remove this temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path=".github/workflows/cleanup-stale-branches.yml"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha')
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message="chore: remove temporary branch cleanup workflow" \
            -f sha="$sha" \
            -f branch="main"
