name: Temporary architecture README update

on:
  push:
    branches:
      - agent/architecture-correctness-hardening
    paths:
      - .github/workflows/apply-architecture-readme.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/architecture-correctness-hardening

      - name: Apply reviewed README additions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          risk_anchor = (
              "- an independent hard Risk controller which can block new risk or require flattening;\n"
          )
          risk_addition = (
              "- defense-in-depth validation of reduce-only direction and cumulative flattening "
              "capacity, so malformed reduce-only ladders fail closed even if Strategy or a venue "
              "adapter is wrong;\n"
          )
          if risk_addition not in text:
              if risk_anchor not in text:
                  raise RuntimeError("README Risk anchor not found")
              text = text.replace(risk_anchor, risk_anchor + risk_addition, 1)

          hft_anchor = (
              "- **hftbacktest** — L2/L3-oriented research oracle for queue-sensitive passive "
              "fills and latency assumptions. Both BUY and SELL replay paths are tested. The "
              "current replay adapter does **not** model exchange-side `reduce_only` enforcement, "
              "so reduce-only safety remains a Strategy/Risk/Nautilus boundary, not an "
              "hftbacktest claim.\n"
          )
          hft_addition = (
              "  `HftReplayConfig.contract_multiplier` is applied to the linear replay asset and "
              "to Tier-2 liquidity, funding, and fee attribution. Legacy synthetic fixtures "
              "default to multiplier `1`; explicit generalized replay binds and validates an "
              "`InstrumentSpec`.\n"
          )
          if hft_addition not in text:
              if hft_anchor not in text:
                  raise RuntimeError("README hftbacktest anchor not found")
              text = text.replace(hft_anchor, hft_anchor + hft_addition, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit README update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "Shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add README.md
          git commit -m "docs: record risk and multiplier architecture contracts"
          git push origin HEAD:agent/architecture-correctness-hardening
